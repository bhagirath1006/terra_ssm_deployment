name: Deploy Portfolio
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get Secrets from Vault
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: github-actions
          secrets: |
            secret/data/aws/credentials access_key | AWS_ACCESS_KEY_ID;
            secret/data/aws/credentials secret_key | AWS_SECRET_ACCESS_KEY
      
      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        run: aws configure set region ap-south-1

      - name: Deploy to EC2 via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "i-008fba951960f93f2" \
            --parameters 'commands=["cd /tmp","rm -rf portfolio-app || true","git clone https://github.com/bhagirath1006/terra_ssm_deployment.git portfolio-app","cd portfolio-app/terra_pipeline/portfolio","docker build -t portfolio .","docker stop portfolio-container || true","docker rm portfolio-container || true","docker run -d --name portfolio-container -p 80:3000 portfolio"]' \
            --region ap-south-1

      - run: echo "Deployment complete - http://13.202.68.247"