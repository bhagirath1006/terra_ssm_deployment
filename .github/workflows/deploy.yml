name: Deploy Portfolio
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "i-008fba951960f93f2" \
            --parameters 'commands=["cd /tmp","rm -rf portfolio-app || true","git clone https://github.com/bhagirath1006/terra_ssm_deployment.git portfolio-app","cd portfolio-app/terra_pipeline/portfolio","docker build -t portfolio .","docker stop portfolio-container || true","docker rm portfolio-container || true","docker run -d --name portfolio-container -p 80:3000 portfolio"]' \
            --region ap-south-1

      - run: echo "Deployment complete - http://13.202.68.247"